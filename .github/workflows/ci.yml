name: CI & Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: true

jobs:
  checks:
    name: Lint, types & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm -C frontend exec vitest run --project unit
      # wrangler.toml is gitignored; the example (local D1) is enough for tests.
      - run: cp backend/wrangler.toml.example backend/wrangler.toml
      - run: pnpm -C backend test:unit

  a11y:
    name: Storybook a11y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -C frontend exec playwright install --with-deps chromium
      - run: pnpm test:a11y

  deploy:
    name: Deploy to Cloudflare
    # Only from main, and only when every check passed.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [checks, a11y]
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The frontend is served by the Worker (static assets) on the same
      # origin as the API, so build it first. An empty API URL makes the app
      # call relative /api/... paths.
      - name: Build frontend
        run: pnpm -C frontend build
        env:
          VITE_API_URL: ''

      - name: Write backend/wrangler.toml
        working-directory: backend
        run: |
          cp wrangler.toml.example wrangler.toml
          sed -i "s|^database_id = .*|database_id = \"${D1_DATABASE_ID}\"|" wrangler.toml
          sed -i "s|^CORS_ORIGIN = .*|CORS_ORIGIN = \"${CORS_ORIGIN}\"|" wrangler.toml
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
      - name: Apply D1 migrations
        run: pnpm -C backend exec wrangler d1 migrations apply money_tracker --remote
      - name: Deploy Worker and frontend
        run: pnpm -C backend deploy
